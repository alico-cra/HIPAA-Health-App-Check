name: Generate Project Tokens Badge
on: push

permissions:
    contents: write

jobs:
    token-count:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - uses: qwibitai/nanoclaw/repo-tokens@main
              with:
                  include: "*.py"
                  exclude: "*.test.py"
                  badge-path: ".github/badges/tokens.svg"
                  context-window: 200000 #Claude Sonnet 4.5

            - name: Commit if changed
              run: |
                  git add README.md .github/badges/tokens.svg
                  git diff --cached --quiet && exit 0
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git commit -m "docs: update token count to ${{ steps.tokens.outputs.badge }}"
                  git push
